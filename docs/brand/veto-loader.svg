<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loading">
  <style>
    .s1,.s2{stroke-dasharray:1 1;stroke-dashoffset:1}
    .s1{animation:s1 1.8s cubic-bezier(.65,0,.35,1) infinite}
    .s2{animation:s2 1.8s cubic-bezier(.65,0,.35,1) infinite}
    .seal{transform-box:view-box;transform-origin:32px 50px;animation:seal 1.8s ease-in-out infinite}
    @keyframes s1{0%{stroke-dashoffset:1;opacity:0}3%{opacity:1}30%{stroke-dashoffset:0}72%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:-1;opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
    @keyframes s2{0%,12%{stroke-dashoffset:1;opacity:0}15%{opacity:1}42%{stroke-dashoffset:0}78%{stroke-dashoffset:0;opacity:1}98%{stroke-dashoffset:-1;opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
    @keyframes seal{0%,42%{transform:scale(1)}50%{transform:scale(1.1)}60%,100%{transform:scale(1)}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
    @media (prefers-reduced-motion: reduce){.s1,.s2{animation:none;stroke-dashoffset:0}.seal{animation:breathe 1.6s ease-in-out infinite}}
  </style>
  <g class="seal">
    <path class="s1" pathLength="1" d="M17 14 32 50" fill="none" stroke="#F2F1E9" stroke-width="11" stroke-linecap="round"/>
    <path class="s2" pathLength="1" d="M47 14 32 50" fill="none" stroke="#FF7966" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
